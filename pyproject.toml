[project]
name = "project-memory"
version = "1.0.0"
description = "Evidence-aware project memory: cited retrieval and commit-scoped GitHub checks."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "jinja2>=3.1.6,<4",
]

[project.scripts]
project-memory = "project_memory.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "playwright>=1.50,<2",
    "pip-audit>=2.8,<3",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL", "live_model: requires a running Ollama service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["project_memory"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true
