name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src
      - run: npm run check && npm run format:check
      - run: uv run pytest -m "not postgres" --cov=project_memory --cov-report=term --cov-report=xml:test-results/coverage.xml --cov-fail-under=80
      - run: uv run python scripts/evaluate.py --output test-results/lexical-evaluation.json
      - run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file test-results/runtime-requirements.txt
      - run: uv run pip-audit -r test-results/runtime-requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: test-results/
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: memory
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U memory" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://memory:ci-only-password@localhost:5432/memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest tests/test_memory.py -m postgres -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/browser -q
        env:
          RUN_BROWSER: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
