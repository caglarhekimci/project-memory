name: Docker validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, postgres]
    env:
      COMPOSE_PROJECT_NAME: memory-${{ github.run_id }}-${{ matrix.storage }}
      COMPOSE_FILE: ${{ matrix.storage == 'postgres' && 'compose.yaml:compose.postgres.yaml' || 'compose.yaml' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Require nonroot runtime
        run: test "$(docker compose exec -T app id -u)" = "10001"
      - run: uv sync --locked
      - run: npm ci
      - run: uv run playwright install --with-deps chromium
      - name: Browser and accessibility against the actual image
        run: uv run pytest tests/browser -q
        env:
          RUN_BROWSER: "1"
          BROWSER_BASE_URL: http://127.0.0.1:4180
      - run: uv run python scripts/docker_smoke.py prepare
      - name: Replace application container and retain data volume
        run: docker compose up -d --force-recreate --wait --wait-timeout 90 app
      - run: uv run python scripts/docker_smoke.py verify
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose logs --no-color > test-results/containers.log 2>&1 || true
          docker compose ps --all > test-results/containers.txt || true
          rm -f test-results/docker-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-${{ matrix.storage }}
          path: test-results/
      - name: Remove only this run's disposable containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
